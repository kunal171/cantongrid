# Owned reference destination: separate service, role, database, port and volume from PQS.
name: cantongrid-storage
services:
  postgres:
    image: postgres@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
    # Bound retained container output to about 30 MB per service.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-cantongrid-admin
      POSTGRES_DB: postgres
    ports:
      - 127.0.0.1:5442:5432
    volumes:
      - storage-data-pg17:/var/lib/postgresql/data
      - ./storage-init.sql:/docker-entrypoint-initdb.d/001-cantongrid.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 512m
volumes:
  storage-data-pg17:
