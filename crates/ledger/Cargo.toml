[package]
name = "cantongrid-ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
include.workspace = true
readme = "README.md"
description = "Current Canton Ledger API user and party-grant verification for CantonGrid."
categories = ["database"]

[dependencies]
cantongrid-core = { path = "../core", version = "=0.4.0-alpha.4" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
jsonwebtoken = { version = "12.0.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "time"] }
