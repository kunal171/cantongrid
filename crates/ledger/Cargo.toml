[package]
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
include.workspace = true
description = "Current Canton Ledger API source-user and party-grant verification for the configured loopback LocalNet profile."
readme = "README.md"
categories = ["database"]
name = "cantongrid-ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
cantongrid-core = { path = "../core", version = "=0.3.0-alpha.1" }
reqwest = { version = "0.13.5", default-features = false }
jsonwebtoken = { version = "12.0.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "time"] }
