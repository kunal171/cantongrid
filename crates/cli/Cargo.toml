[package]
name = "cantongrid-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "cantongrid"
path = "src/main.rs"

[dependencies]
cantongrid-core = { path = "../core", version = "=0.1.0-alpha.1" }
serde_json = "1.0"
cantongrid-storage = { path = "../storage", version = "=0.1.0-alpha.1" }
cantongrid-pqs = { path = "../pqs", version = "=0.1.0-alpha.1" }

cantongrid-ledger = { path = "../ledger", version = "=0.1.0-alpha.1" }
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
cantongrid-postgres = { path = "../postgres", version = "=0.1.0-alpha.1" }
