[package]
name = "cantongrid-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
include.workspace = true
readme = "README.md"
description = "CantonGrid CLI for authorized Daml contract indexing, model generation and query services."
categories = ["command-line-utilities"]

[[bin]]
name = "cantongrid"
path = "src/main.rs"

[dependencies]
cantongrid-metadata = { path = "../metadata", version = "=0.4.0" }
cantongrid-core = { path = "../core", version = "=0.4.0" }
serde_json = "1.0"
cantongrid-storage = { path = "../storage", version = "=0.4.0" }
cantongrid-pqs = { path = "../pqs", version = "=0.4.0" }

cantongrid-ledger = { path = "../ledger", version = "=0.4.0" }
tokio = { version = "1", features = ["rt", "time"] }

cantongrid-runtime = { path = "../runtime", version = "=0.4.0" }

cantongrid-models = { path = "../models", version = "=0.4.0" }
cantongrid-sync = { path = "../sync", version = "=0.4.0" }

[dev-dependencies]
cantongrid-postgres = { path = "../postgres", version = "=0.4.0" }

jsonwebtoken = { version = "12.0.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
