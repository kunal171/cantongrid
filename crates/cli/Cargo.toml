[package]
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
include.workspace = true
description = "The cantongrid command-line executable for fixture replay and the source/indexing operations supported by this release.."
readme = "README.md"
categories = ["database"]
name = "cantongrid-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "cantongrid"
path = "src/main.rs"

[dependencies]
cantongrid-core = { path = "../core", version = "=0.3.0-alpha.2" }
serde_json = "1.0"
cantongrid-storage = { path = "../storage", version = "=0.3.0-alpha.2" }
cantongrid-pqs = { path = "../pqs", version = "=0.3.0-alpha.2" }

cantongrid-ledger = { path = "../ledger", version = "=0.3.0-alpha.2" }
tokio = { version = "1", features = ["rt", "time"] }

cantongrid-runtime = { path = "../runtime", version = "=0.3.0-alpha.2" }

cantongrid-models = { path = "../models", version = "=0.3.0-alpha.2" }

[dev-dependencies]
cantongrid-postgres = { path = "../postgres", version = "=0.3.0-alpha.2" }

jsonwebtoken = { version = "12.0.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
