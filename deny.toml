# Runtime/development dependency policy. This does not publish a project license.
[advisories]
yanked = "deny"
unmaintained = "all"

[licenses]
include-dev = true
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.95

# Workspace packages are currently non-publishable; actual license publication is a release gate.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
