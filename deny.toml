# Runtime/development dependency policy, including workspace packages.
[advisories]
yanked = "deny"
unmaintained = "all"

[licenses]
include-dev = true
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.95

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
