[workspace]
members = ["crates/core", "crates/cli", "crates/storage", "crates/postgres", "crates/pqs", "crates/ledger", "crates/runtime", "crates/models", "crates/metadata", "crates/sync"]
resolver = "3"

[workspace.package]
version = "0.4.0-alpha.6"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.100"
publish = ["crates-io"]
repository = "https://github.com/kunal171/cantongrid"
homepage = "https://shady-3.gitbook.io/cantongrid/"
keywords = ["canton", "daml", "indexer", "graphql", "postgresql"]
include = ["src/**", "tests/**", "assets/**", "migrations/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]
